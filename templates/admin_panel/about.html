{% extends "admin_panel/base.html" %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h3>{% if lang == 'fa' %}بخش درباره ما{% else %}About Section{% endif %}</h3>
    </div>
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="tabs" data-group="about">
                <button type="button" class="tab-btn active" data-tab="about-main">{% if lang == 'fa' %}محتوای اصلی{% else %}Main Content{% endif %}</button>
                <button type="button" class="tab-btn" data-tab="about-who">{% if lang == 'fa' %}ما کیستیم{% else %}Who We Are{% endif %}</button>
                <button type="button" class="tab-btn" data-tab="about-why">{% if lang == 'fa' %}چرا ما{% else %}Why Choose Us{% endif %}</button>
            </div>
            <div class="tab-content active" id="about-main" data-group="about">
                <div class="form-row">
                    <div class="form-group"><label class="form-label">{% if lang == 'fa' %}عنوان (EN){% else %}Title (EN){% endif %}</label><input type="text" name="title_en" class="form-control" value="{{ obj.title_en }}"></div>
                    <div class="form-group"><label class="form-label">{% if lang == 'fa' %}عنوان (FA){% else %}Title (FA){% endif %}</label><input type="text" name="title_fa" class="form-control" value="{{ obj.title_fa }}" dir="rtl"></div>
                </div>
                <div class="form-group"><label class="form-label">{% if lang == 'fa' %}محتوا (EN){% else %}Content (EN){% endif %}</label><textarea name="content_en" class="form-control" rows="5">{{ obj.content_en }}</textarea></div>
                <div class="form-group"><label class="form-label">{% if lang == 'fa' %}محتوا (FA){% else %}Content (FA){% endif %}</label><textarea name="content_fa" class="form-control" rows="5" dir="rtl">{{ obj.content_fa }}</textarea></div>
                <div class="form-group"><label class="form-label">{% if lang == 'fa' %}تصویر{% else %}Image{% endif %}</label>{% if obj.image %}<div style="margin-bottom:8px"><img src="{{ obj.image.url }}" class="image-preview"></div>{% endif %}<input type="file" name="image" class="form-control" accept="image/*"></div>
            </div>
            <div class="tab-content" id="about-who" data-group="about">
                <div class="form-group"><label class="form-label">{% if lang == 'fa' %}ما کیستیم (EN){% else %}Who We Are (EN){% endif %}</label><textarea name="who_we_are_en" class="form-control" rows="4">{{ obj.who_we_are_en }}</textarea></div>
                <div class="form-group"><label class="form-label">{% if lang == 'fa' %}ما کیستیم (FA){% else %}Who We Are (FA){% endif %}</label><textarea name="who_we_are_fa" class="form-control" rows="4" dir="rtl">{{ obj.who_we_are_fa }}</textarea></div>
                <div class="form-group"><label class="form-label">{% if lang == 'fa' %}ما متخصصیم (EN){% else %}We Are Expert (EN){% endif %}</label><textarea name="we_are_expert_en" class="form-control" rows="4">{{ obj.we_are_expert_en }}</textarea></div>
                <div class="form-group"><label class="form-label">{% if lang == 'fa' %}ما متخصصیم (FA){% else %}We Are Expert (FA){% endif %}</label><textarea name="we_are_expert_fa" class="form-control" rows="4" dir="rtl">{{ obj.we_are_expert_fa }}</textarea></div>
            </div>
            <div class="tab-content" id="about-why" data-group="about">
                <div class="form-row">
                    <div class="form-group"><label class="form-label">{% if lang == 'fa' %}عنوان (EN){% else %}Title (EN){% endif %}</label><input type="text" name="why_choose_us_title_en" class="form-control" value="{{ obj.why_choose_us_title_en }}"></div>
                    <div class="form-group"><label class="form-label">{% if lang == 'fa' %}عنوان (FA){% else %}Title (FA){% endif %}</label><input type="text" name="why_choose_us_title_fa" class="form-control" value="{{ obj.why_choose_us_title_fa }}" dir="rtl"></div>
                </div>
                <div class="form-group"><label class="form-label">{% if lang == 'fa' %}توضیحات (EN){% else %}Content (EN){% endif %}</label><textarea name="why_choose_us_content_en" class="form-control" rows="4">{{ obj.why_choose_us_content_en }}</textarea></div>
                <div class="form-group"><label class="form-label">{% if lang == 'fa' %}توضیحات (FA){% else %}Content (FA){% endif %}</label><textarea name="why_choose_us_content_fa" class="form-control" rows="4" dir="rtl">{{ obj.why_choose_us_content_fa }}</textarea></div>
                <div class="form-group"><label class="form-label">{% if lang == 'fa' %}تصویر{% else %}Image{% endif %}</label>{% if obj.why_choose_us_image %}<div style="margin-bottom:8px"><img src="{{ obj.why_choose_us_image.url }}" class="image-preview"></div>{% endif %}<input type="file" name="why_choose_us_image" class="form-control" accept="image/*"></div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label">{% if lang == 'fa' %}متن دکمه (EN){% else %}CTA (EN){% endif %}</label><input type="text" name="cta_text_en" class="form-control" value="{{ obj.cta_text_en }}"></div>
                    <div class="form-group"><label class="form-label">{% if lang == 'fa' %}متن دکمه (FA){% else %}CTA (FA){% endif %}</label><input type="text" name="cta_text_fa" class="form-control" value="{{ obj.cta_text_fa }}" dir="rtl"></div>
                </div>
                <div class="form-group"><label class="form-label">{% if lang == 'fa' %}لینک دکمه{% else %}CTA URL{% endif %}</label><input type="text" name="cta_url" class="form-control" value="{{ obj.cta_url }}"></div>
            </div>
            <div class="form-group"><label class="form-check"><input type="checkbox" name="is_active" {% if obj.is_active %}checked{% endif %}><span>{% if lang == 'fa' %}فعال{% else %}Active{% endif %}</span></label></div>
            <div class="form-actions"><button type="submit" class="btn btn-primary"><i class="ph ph-floppy-disk"></i> {% if lang == 'fa' %}ذخیره{% else %}Save{% endif %}</button></div>
        </form>
    </div>
</div>
{% endblock %}
